services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HUB_PORT:-3000}:3000"
    environment:
      PORT: 3000
      STATE_SECRET: "${STATE_SECRET}"
      ALLOWED_REDIRECT_HOSTS: "${ALLOWED_REDIRECT_HOSTS}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_ACCESS_EXPIRY_SECONDS: "${JWT_ACCESS_EXPIRY_SECONDS:-900}"
      JWT_REFRESH_EXPIRY_SECONDS: "${JWT_REFRESH_EXPIRY_SECONDS:-2592000}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL}"
      MP_ACCESS_TOKEN: "${MP_ACCESS_TOKEN}"
      MP_WEBHOOK_SECRET: "${MP_WEBHOOK_SECRET}"
      MP_SUCCESS_URL: "${MP_SUCCESS_URL}"
      MP_FAILURE_URL: "${MP_FAILURE_URL}"
      MP_PENDING_URL: "${MP_PENDING_URL}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET}"
      PAYPAL_MODE: "${PAYPAL_MODE:-sandbox}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID}"
      PAYPAL_SUCCESS_URL: "${PAYPAL_SUCCESS_URL}"
      PAYPAL_CANCEL_URL: "${PAYPAL_CANCEL_URL}"
      STRAPI_URL: "${STRAPI_URL}"
      STRAPI_TOKEN: "${STRAPI_TOKEN}"
      STRAPI_WEBHOOK_SECRET: "${STRAPI_WEBHOOK_SECRET}"
      CALDAV_URL: "${CALDAV_URL}"
      CALDAV_USERNAME: "${CALDAV_USERNAME}"
      CALDAV_PASSWORD: "${CALDAV_PASSWORD}"
      JITSI_BASE_URL: "${JITSI_BASE_URL:-https://talk.jesusuzcategui.com}"
      MENTORING_TEACHER_ID: "${MENTORING_TEACHER_ID}"
      PORTFOLIO_ORIGIN: "${PORTFOLIO_ORIGIN}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_CALLBACK_URL: "${GITHUB_CALLBACK_URL}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
