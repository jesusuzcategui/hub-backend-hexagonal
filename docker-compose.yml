services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
      # Compose does NOT forward project/host env vars into Dockerfile ARGs
      # automatically — without this, GH_TOKEN reaches the Dockerfile empty
      # and the private hexagonal-payments-core install fails even if
      # Coolify has GH_TOKEN set.
      args:
        GH_TOKEN: "${GH_TOKEN:?GH_TOKEN is required to install hexagonal-payments-core}"
    # Loopback only: the reverse proxy (Traefik/Caddy) reaches the container over the Docker network. Publishing on
    # 0.0.0.0 exposed the plain-HTTP hub on the VPS public address.
    ports:
      - "127.0.0.1:${HUB_PORT:-3000}:3000"
    environment:
      PORT: 3000
      STATE_SECRET: "${STATE_SECRET:?STATE_SECRET is required}"
      ALLOWED_REDIRECT_HOSTS: "${ALLOWED_REDIRECT_HOSTS:-}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      # The bundled `redis` service always starts. Set REDIS_URL=redis://redis:6379 to use it; empty/unset means the hub
      # does not use Redis at all (it runs fine without it, caching in memory).
      REDIS_URL: "${REDIS_URL-}"
      CACHE_PREFIX: "${CACHE_PREFIX:-}"
      CACHE_ENABLED: "${CACHE_ENABLED:-}"
      TRUST_PROXY: "${TRUST_PROXY:-}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}"
      JWT_ACCESS_EXPIRY_SECONDS: "${JWT_ACCESS_EXPIRY_SECONDS:-900}"
      JWT_REFRESH_EXPIRY_SECONDS: "${JWT_REFRESH_EXPIRY_SECONDS:-2592000}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      CAMPUS_ORIGIN: "${CAMPUS_ORIGIN:-}"
      ADMIN_NOTIFICATION_EMAIL: "${ADMIN_NOTIFICATION_EMAIL:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      EPAYCO_CUST_ID_CLIENTE: "${EPAYCO_CUST_ID_CLIENTE:-}"
      EPAYCO_P_KEY: "${EPAYCO_P_KEY:-}"
      EPAYCO_PUBLIC_KEY: "${EPAYCO_PUBLIC_KEY:-}"
      EPAYCO_PRIVATE_KEY: "${EPAYCO_PRIVATE_KEY:-}"
      EPAYCO_VALIDATION_BASE_URL: "${EPAYCO_VALIDATION_BASE_URL:-https://api.epayco.co}"
      EPAYCO_SUCCESS_URL: "${EPAYCO_SUCCESS_URL:-}"
      EPAYCO_FAILURE_URL: "${EPAYCO_FAILURE_URL:-}"
      EPAYCO_PENDING_URL: "${EPAYCO_PENDING_URL:-}"
      EPAYCO_CONFIRMATION_URL: "${EPAYCO_CONFIRMATION_URL:-}"
      MP_ACCESS_TOKEN: "${MP_ACCESS_TOKEN:-}"
      MP_WEBHOOK_SECRET: "${MP_WEBHOOK_SECRET:-}"
      MP_SUCCESS_URL: "${MP_SUCCESS_URL:-}"
      MP_FAILURE_URL: "${MP_FAILURE_URL:-}"
      MP_PENDING_URL: "${MP_PENDING_URL:-}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_MODE: "${PAYPAL_MODE:-sandbox}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID:-}"
      PAYPAL_SUCCESS_URL: "${PAYPAL_SUCCESS_URL:-}"
      PAYPAL_CANCEL_URL: "${PAYPAL_CANCEL_URL:-}"
      WP_URL: "${WP_URL:?WP_URL is required}"
      WP_APP_USER: "${WP_APP_USER:?WP_APP_USER is required}"
      WP_APP_PASS: "${WP_APP_PASS:?WP_APP_PASS is required}"
      WP_WEBHOOK_SECRET: "${WP_WEBHOOK_SECRET:?WP_WEBHOOK_SECRET is required}"
      # Legacy, optional: portfolio reviews still post to Strapi
      STRAPI_URL: "${STRAPI_URL:-}"
      STRAPI_TOKEN: "${STRAPI_TOKEN:-}"
      CALDAV_URL: "${CALDAV_URL:?CALDAV_URL is required}"
      CALDAV_USERNAME: "${CALDAV_USERNAME:?CALDAV_USERNAME is required}"
      CALDAV_PASSWORD: "${CALDAV_PASSWORD:?CALDAV_PASSWORD is required}"
      # Busy-time sync from the owner's Nextcloud calendar (optional, these are the defaults)
      CALDAV_SYNC_ENABLED: "${CALDAV_SYNC_ENABLED:-true}"
      CALDAV_SYNC_HORIZON_WEEKS: "${CALDAV_SYNC_HORIZON_WEEKS:-16}"
      CALDAV_ALL_DAY_BLOCKS: "${CALDAV_ALL_DAY_BLOCKS:-true}"
      CALDAV_SYNC_EXPAND: "${CALDAV_SYNC_EXPAND:-true}"
      # In-process background jobs. Both default to ON when unset; set =false to disable (e.g. staging reminders).
      REMINDERS_ENABLED: "${REMINDERS_ENABLED:-true}"
      PAYMENT_AUTOVERIFY_ENABLED: "${PAYMENT_AUTOVERIFY_ENABLED:-true}"
      JITSI_BASE_URL: "${JITSI_BASE_URL:-https://talk.jesusuzcategui.com}"
      MENTORING_TEACHER_ID: "${MENTORING_TEACHER_ID:?MENTORING_TEACHER_ID is required}"
      PORTFOLIO_ORIGIN: "${PORTFOLIO_ORIGIN:-}"
      SMTP_HOST: "${SMTP_HOST:?SMTP_HOST is required}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_USER: "${SMTP_USER:?SMTP_USER is required}"
      SMTP_PASS: "${SMTP_PASS:?SMTP_PASS is required}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_CALLBACK_URL: "${GITHUB_CALLBACK_URL:-}"
      CAP_SITE_KEY: "${CAP_SITE_KEY:-}"
      CAP_PRIVATE_KEY: "${CAP_PRIVATE_KEY:-}"
      WEBDAV_URL: "${WEBDAV_URL:-}"
      WEBDAV_USERNAME: "${WEBDAV_USERNAME:-}"
      WEBDAV_PASSWORD: "${WEBDAV_PASSWORD:-}"
      UMAMI_URL: "${UMAMI_URL:-}"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    # Loopback only (reach it with an SSH tunnel). A public 0.0.0.0 mapping leaves the database one password away from
    # the internet on a VPS without a firewall.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Loopback only: this Redis has no password, it must never be published on a public interface.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
